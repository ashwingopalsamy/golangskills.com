name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    name: Go ${{ matrix.go-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.24.x", "1.25.x", "1.26.x"]

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l ./cmd ./internal)"

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build repository tool
        run: go build -o /tmp/skillctl ./cmd/skillctl

      - name: Validate corpus and generated output
        run: go run ./cmd/skillctl check

      - name: Lint GitHub Actions workflow
        if: matrix.go-version == '1.26.x'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate the open Agent Skills specification
        if: matrix.go-version == '1.26.x'
        env:
          SKILLS_REF_COMMIT: 69ef37e9424c0a7ea9dd2293b559e43ec8176379
        run: |
          python3 -m pip install "git+https://github.com/agentskills/agentskills.git@${SKILLS_REF_COMMIT}#subdirectory=skills-ref"
          for skill in skills/*; do
            skills-ref validate "$skill"
          done
